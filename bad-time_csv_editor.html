<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bad Time弹幕编辑器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a0a;color:#e8e8e8;font-family:"Microsoft YaHei",sans-serif;font-size:15px;user-select:none}
.btn{padding:8px 14px;background:#1c1c1c;border:2px solid #3a3a3a;border-radius:8px;font-size:14px;color:#e8e8e8;cursor:pointer;white-space:nowrap;transition:all .12s;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:#252525}
.btn.primary{background:#4a6cf7;border-color:#4a6cf7;color:#fff}
.btn.small{padding:5px 10px;font-size:12px;min-height:32px}

#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#141414;border-bottom:2px solid #2a2a2a;flex-shrink:0;min-height:52px}
#topbar .title{font-size:17px;font-weight:600;white-space:nowrap;margin-right:12px}
.tab{padding:6px 14px;background:#1c1c1c;border:2px solid #2a2a2a;border-radius:8px;font-size:14px;cursor:pointer;color:#aaa;min-height:36px;display:inline-flex;align-items:center}
.tab.active{background:#4a6cf7;border-color:#4a6cf7;color:#fff;font-weight:600}
.tab:hover:not(.active){background:#252525}
#topbar .spacer{flex:1}

#body{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ===== 拖拽模式 ===== */
#modeDrag{flex:1;display:flex;flex-direction:column;overflow:hidden}
#modeDrag.hidden{display:none}
#canvasArea{flex:1;position:relative;background:#050505;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;min-height:0}
#canvasWrap{position:relative;background:#0a0a0a;border:2px solid #3a3a3a}
#canvas{display:block;touch-action:none;cursor:default}
#canvasInfo{position:absolute;top:6px;left:8px;font-size:12px;color:#888;font-family:monospace;pointer-events:none}

#paramBar{flex-shrink:0;background:#141414;border-top:2px solid #2a2a2a;padding:0 12px;display:flex;gap:10px;align-items:center;flex-wrap:nowrap;min-height:48px;max-height:48px;overflow-x:auto;overflow-y:hidden;transition:max-height .18s ease,opacity .18s ease,padding .18s ease;opacity:0;border-top-width:0}
#paramBar.show{opacity:1;padding-top:8px;padding-bottom:8px;border-top-width:2px}
#paramBar::-webkit-scrollbar{height:6px}
#paramBar::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:3px}
#paramBar .pname{font-size:14px;font-weight:600;color:#4a6cf7;min-width:70px;white-space:nowrap;flex-shrink:0;position:sticky;left:0;background:#141414;padding-right:8px;z-index:2}
#paramBar .pitem{display:flex;align-items:center;gap:6px;flex-shrink:0}
#paramBar .plabel{font-size:12px;color:#aaa;white-space:nowrap}
#paramBar .pval{font-family:monospace;font-size:13px;color:#fbbf24;min-width:40px;text-align:right}
#paramBar input[type=range]{-webkit-appearance:none;width:100px;height:8px;background:#3a3a3a;border-radius:4px;outline:none}
#paramBar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:#4a6cf7;border-radius:50%;cursor:pointer;border:2px solid #fff}
#paramBar select,#paramBar input[type=text]{padding:4px 6px;background:#0d0d0d;border:2px solid #3a3a3a;border-radius:6px;color:#e8e8e8;font-size:13px;min-height:32px}
#paramBar select:focus,#paramBar input[type=text]:focus{border-color:#fff;outline:none}
#paramBar .pdel{background:#3a1a1a;border-color:#5a2a2a;color:#f87171;flex-shrink:0}
#paramBar .pcopy{flex-shrink:0}

#timeline{flex-shrink:0;background:#101010;border-top:2px solid #2a2a2a;height:120px;display:flex;flex-direction:column}
#timelineHeader{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid #222;flex-shrink:0}
#timelineHeader .tlabel{font-size:12px;color:#888;letter-spacing:2px}
#timelineScroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
#timelineTrack{position:relative;height:100%;min-width:100%}
.tl-block{position:absolute;top:8px;height:40px;background:#1c1c1c;border:2px solid #4a6cf7;border-radius:6px;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:12px;color:#e8e8e8;white-space:nowrap;overflow:hidden;padding:0 6px;transition:border-color .1s}
.tl-block.selected{border-color:#ffcc44;box-shadow:0 0 0 2px #ffcc44}
.tl-block.sound{border-color:#66ddff;background:#0a1a22}
.tl-block.sound.selected{border-color:#ffcc44}
.tl-block:active{cursor:grabbing}

#bottomTools{flex-shrink:0;background:#141414;border-top:2px solid #2a2a2a;padding:8px 12px;display:flex;gap:8px;overflow-x:auto;min-height:72px;align-items:center}
#bottomTools::-webkit-scrollbar{height:0}
.tool-btn{flex-shrink:0;min-width:76px;height:56px;background:#1c1c1c;border:2px solid #2a2a2a;border-radius:8px;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .12s;padding:4px 8px}
.tool-btn:hover{background:#252525;border-color:#4a6cf7}
.tool-btn:active{cursor:grabbing}
.tool-btn .tn{font-size:13px;font-weight:600;color:#4a6cf7}
.tool-btn .tc{font-size:10px;color:#888}

/* ===== 脚本模式 ===== */
#modeScript{flex:1;display:flex;flex-direction:row;overflow:hidden}
#modeScript.hidden{display:none}
#scriptLeft{flex:1;display:flex;flex-direction:column;border-right:2px solid #2a2a2a;min-width:0}
#scriptToolbar{display:flex;gap:6px;padding:8px 10px;background:#141414;border-bottom:2px solid #2a2a2a;flex-shrink:0;flex-wrap:wrap;align-items:center}
#scriptToolbar .stoggle{display:flex;gap:4px;margin-right:8px}
.stab{padding:5px 12px;background:#1c1c1c;border:2px solid #2a2a2a;border-radius:6px;font-size:13px;cursor:pointer;color:#aaa;min-height:32px;display:inline-flex;align-items:center}
.stab.active{background:#4a6cf7;border-color:#4a6cf7;color:#fff;font-weight:600}

#scriptEditorWrap{flex:1;position:relative;display:flex;overflow:hidden;background:#0d0d0d}
#scriptEditorWrap.hidden{display:none}
#scriptLineNums{flex-shrink:0;padding:10px 6px 10px 10px;background:#0a0a0a;color:#555;font-family:monospace;font-size:13px;line-height:1.6;text-align:right;overflow:hidden;user-select:none;white-space:pre}
#scriptEditor{flex:1;padding:10px;background:#0d0d0d;border:none;outline:none;color:#e8e8e8;font-family:monospace;font-size:13px;line-height:1.6;resize:none;white-space:pre;overflow:auto;tab-size:2}

/* 图形模式 */
#scriptGraphWrap{flex:1;overflow-y:auto;padding:8px;background:#0d0d0d}
#scriptGraphWrap.hidden{display:none}
.gcard{display:flex;align-items:flex-start;gap:6px;padding:8px;background:#161616;border:2px solid #2a2a2a;border-radius:8px;margin-bottom:6px}
.gcard .gline{font-family:monospace;font-size:12px;color:#555;min-width:28px;text-align:right;padding-top:6px}
.gcard .gtime{width:64px;flex-shrink:0}
.gcard .gtime input{width:100%;padding:5px 6px;background:#0d0d0d;border:2px solid #3a3a3a;border-radius:6px;color:#fbbf24;font-family:monospace;font-size:13px;min-height:32px}
.gcard .gfunc{width:130px;flex-shrink:0}
.gcard .gfunc select{width:100%;padding:5px 6px;background:#0d0d0d;border:2px solid #3a3a3a;border-radius:6px;color:#4a6cf7;font-size:13px;min-height:32px;font-weight:600}
.gcard .gargs{flex:1;display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.garg{display:flex;align-items:center;gap:2px}
.garg input{padding:5px 6px;background:#0d0d0d;border:2px solid #3a3a3a;border-radius:6px;color:#e8e8e8;font-family:monospace;font-size:13px;min-height:32px;width:80px}
.garg .vbtn{width:26px;height:32px;background:#1c1c1c;border:2px solid #3a3a3a;border-radius:6px;color:#66ddff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:600}
.garg .vbtn:hover{background:#252525;border-color:#66ddff}
.gcard .gops{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.gcard .gops button{width:28px;height:22px;background:#1c1c1c;border:1px solid #3a3a3a;border-radius:4px;color:#aaa;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gcard .gops button:hover{background:#252525;color:#fff}
.gcard .gops button.del:hover{background:#3a1a1a;color:#f87171;border-color:#5a2a2a}

#scriptRight{flex:1;display:flex;flex-direction:column;min-width:0;background:#050505}
#scriptPreviewWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;position:relative}
#scriptCanvas{display:block;background:#0a0a0a;border:2px solid #3a3a3a;touch-action:none;cursor:grab}
#scriptVars{padding:8px 12px;background:#141414;border-top:2px solid #2a2a2a;font-family:monospace;font-size:12px;color:#aaa;max-height:120px;overflow-y:auto;flex-shrink:0}
#scriptVars .vname{color:#66ddff}
#scriptVars .vval{color:#fbbf24}
#scriptStatus{padding:6px 12px;background:#0f0f0f;border-top:1px solid #222;font-size:12px;color:#888;font-family:monospace;flex-shrink:0}

/* 补全下拉 */
#autocomplete{position:fixed;z-index:6000;background:#1c1c1c;border:2px solid #4a6cf7;border-radius:8px;max-height:220px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.8);min-width:180px}
#autocomplete.show{display:block}
#autocomplete .ac-item{padding:7px 12px;font-family:monospace;font-size:13px;cursor:pointer;color:#e8e8e8;white-space:nowrap;display:flex;gap:8px;align-items:center}
#autocomplete .ac-item .ac-kind{font-size:10px;padding:1px 5px;border-radius:3px;background:#333;color:#aaa}
#autocomplete .ac-item .ac-kind.cmd{background:#4a6cf7;color:#fff}
#autocomplete .ac-item .ac-kind.var{background:#66ddff;color:#000}
#autocomplete .ac-item .ac-kind.snip{background:#fbbf24;color:#000}
#autocomplete .ac-item.active,#autocomplete .ac-item:hover{background:#4a6cf7;color:#fff}
#autocomplete .ac-item.active .ac-kind,#autocomplete .ac-item:hover .ac-kind{background:rgba(255,255,255,.3);color:#fff}

/* 变量下拉 */
#varPicker{position:fixed;z-index:6000;background:#1c1c1c;border:2px solid #66ddff;border-radius:8px;max-height:240px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.8);min-width:140px}
#varPicker.show{display:block}
#varPicker .vp-item{padding:7px 12px;font-family:monospace;font-size:13px;cursor:pointer;color:#66ddff}
#varPicker .vp-item:hover{background:#66ddff;color:#000}
#varPicker .vp-empty{padding:10px 12px;font-size:12px;color:#888}

/* ===== 通用 ===== */
#statusBar{padding:6px 14px;background:#0f0f0f;border-top:1px solid #222;font-size:12px;color:#888;font-family:monospace;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#dragGhost{position:fixed;pointer-events:none;z-index:5000;padding:8px 14px;background:#4a6cf7;color:#fff;border-radius:8px;font-size:13px;font-weight:600;display:none;transform:translate(-50%,-50%);box-shadow:0 8px 24px rgba(0,0,0,.6)}
#dragGhost.show{display:block}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}
.modal-mask.show{display:flex}
.modal{background:#141414;border:2px solid #3a3a3a;border-radius:14px;width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.9)}
.modal-header{padding:14px 18px;border-bottom:2px solid #2a2a2a;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-close{font-size:26px;line-height:1;color:#888;padding:0 6px;cursor:pointer;background:none;border:none}
.modal-close:hover{color:#fff}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;font-size:14px;line-height:1.7;color:#ccc}
.modal-body h3{color:#4a6cf7;margin:14px 0 6px;font-size:15px}
.modal-body h3:first-child{margin-top:0}
.modal-body code{background:#0d0d0d;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px;color:#fbbf24}
.modal-body ul{margin:4px 0 4px 20px}
.modal-body li{margin:2px 0}
.modal-body table{border-collapse:collapse;width:100%;margin:6px 0}
.modal-body th,.modal-body td{border:1px solid #2a2a2a;padding:4px 8px;text-align:left;font-size:13px}
.modal-body th{background:#1c1c1c;color:#4a6cf7}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="title">Bad time</div>
    <div class="tab active" id="tabDrag">拖拽</div>
    <div class="tab" id="tabScript">脚本</div>
    <div class="spacer"></div>
    <button class="btn small" id="btnHelp">? 使用说明</button>
    <button class="btn small" id="btnAddCmd">+ 添加</button>
    <button class="btn small" id="btnPlay">▶播放</button>
    <button class="btn primary" id="btnSave">保存 CSV</button>
  </div>

  <div id="body">
    <!-- 拖拽模式 -->
    <div id="modeDrag">
      <div id="canvasArea">
        <div id="canvasWrap">
          <canvas id="canvas"></canvas>
          <div id="canvasInfo">375 × 140</div>
        </div>
      </div>
      <div id="paramBar"></div>
      <div id="timeline">
        <div id="timelineHeader">
          <span class="tlabel">时间轴</span>
          <button class="btn small" id="btnImport">导入csv</button>
          <button class="btn small" id="btnClear">清空</button>
          <span style="margin-left:auto;font-size:11px;color:#666">拖方块改延迟 · 点方块选中</span>
        </div>
        <div id="timelineScroll"><div id="timelineTrack"></div></div>
      </div>
      <div id="bottomTools"></div>
    </div>

    <!-- 脚本模式 -->
    <div id="modeScript" class="hidden">
      <div id="scriptLeft">
        <div id="scriptToolbar">
          <div class="stoggle">
            <div class="stab active" id="stabWrite">编写</div>
            <div class="stab" id="stabGraph">图形</div>
          </div>
          <button class="btn small" id="scPreview">▶预览</button>
          <button class="btn small" id="scStop">■停止</button>
          <button class="btn small" id="scLoadExample">载入示例</button>
          <button class="btn small" id="scClear">清空</button>
        </div>
        <div id="scriptEditorWrap">
          <div id="scriptLineNums">0</div>
          <textarea id="scriptEditor" spellcheck="false" placeholder="0,CombatZoneResize,121,186,526,391,TLResume&#10;0,HeartTeleport,320,304&#10;0,HeartMode,0&#10;0,TLPause&#10;0,SET,gt,0&#10;0.5,SET,Loop,35&#10;..."></textarea>
        </div>
        <div id="scriptGraphWrap" class="hidden"></div>
      </div>
      <div id="scriptRight">
        <div id="scriptPreviewWrap"><canvas id="scriptCanvas"></canvas></div>
        <div id="scriptVars"></div>
        <div id="scriptStatus">未运行</div>
      </div>
    </div>
  </div>

  <div id="statusBar">就绪</div>
</div>

<div id="dragGhost"></div>
<div id="autocomplete"></div>
<div id="varPicker"></div>

<div class="modal-mask" id="helpMask">
  <div class="modal">
    <div class="modal-header"><span>使用说明</span><button class="modal-close" id="helpClose">×</button></div>
    <div class="modal-body" id="helpBody"></div>
  </div>
</div>

<div class="modal-mask" id="addMask">
  <div class="modal">
    <div class="modal-header"><span>添加指令</span><button class="modal-close" id="addClose">×</button></div>
    <div class="modal-body" id="addBody"></div>
  </div>
</div>

<script>
/* ==================== 数据定义 ==================== */
const CMD_DEFS = {
  BoneH:{label:'水平骨头',params:[{k:'x',t:'X',min:0,max:375,step:1},{k:'y',t:'Y',min:0,max:140,step:1},{k:'len',t:'长度',min:10,max:300,step:5},{k:'dir',t:'方向',opts:[{v:0,t:'右'},{v:1,t:'下'},{v:2,t:'左'},{v:3,t:'上'}]},{k:'spd',t:'速度',min:50,max:800,step:10},{k:'col',t:'颜色',opts:[{v:0,t:'白'},{v:1,t:'蓝'},{v:2,t:'橙'}]}]},
  BoneV:{label:'垂直骨头',params:[{k:'x',t:'X',min:0,max:375,step:1},{k:'y',t:'Y',min:0,max:140,step:1},{k:'len',t:'长度',min:10,max:300,step:5},{k:'dir',t:'方向',opts:[{v:0,t:'右'},{v:1,t:'下'},{v:2,t:'左'},{v:3,t:'上'}]},{k:'spd',t:'速度',min:50,max:800,step:10},{k:'col',t:'颜色',opts:[{v:0,t:'白'},{v:1,t:'蓝'},{v:2,t:'橙'}]}]},
  BoneHRepeat:{label:'水平阵列',params:[{k:'x',t:'X',min:0,max:375,step:1},{k:'y',t:'Y',min:0,max:140,step:1},{k:'len',t:'长度',min:10,max:300,step:5},{k:'dir',t:'方向',opts:[{v:0,t:'右'},{v:1,t:'下'},{v:2,t:'左'},{v:3,t:'上'}]},{k:'spd',t:'速度',min:50,max:800,step:10},{k:'cnt',t:'数量',min:1,max:20,step:1},{k:'gap',t:'间距',min:10,max:200,step:5}]},
  BoneVRepeat:{label:'垂直阵列',params:[{k:'x',t:'X',min:0,max:375,step:1},{k:'y',t:'Y',min:0,max:140,step:1},{k:'len',t:'长度',min:10,max:300,step:5},{k:'dir',t:'方向',opts:[{v:0,t:'右'},{v:1,t:'下'},{v:2,t:'左'},{v:3,t:'上'}]},{k:'spd',t:'速度',min:50,max:800,step:10},{k:'cnt',t:'数量',min:1,max:20,step:1},{k:'gap',t:'间距',min:10,max:200,step:5}]},
  BoneStab:{label:'骨墙',params:[{k:'dir',t:'方向',opts:[{v:0,t:'右'},{v:1,t:'下'},{v:2,t:'左'},{v:3,t:'上'}]},{k:'dist',t:'距离',min:10,max:300,step:5},{k:'warn',t:'预警',min:0,max:3,step:0.1},{k:'stay',t:'停留',min:0,max:3,step:0.1}]},
  GasterBlaster:{label:'龙骨炮',params:[{k:'size',t:'尺寸',opts:[{v:0,t:'细'},{v:1,t:'正常'},{v:2,t:'大'}]},{k:'sx',t:'起始X',min:0,max:375,step:1},{k:'sy',t:'起始Y',min:0,max:140,step:1},{k:'ex',t:'终点X',min:0,max:375,step:1},{k:'ey',t:'终点Y',min:0,max:140,step:1},{k:'ang',t:'角度',min:0,max:360,step:5},{k:'spin',t:'蓄力',min:0,max:3,step:0.05},{k:'blast',t:'开火',min:0,max:3,step:0.05}]},
  HeartMode:{label:'灵魂模式',params:[{k:'mode',t:'模式',opts:[{v:0,t:'红'},{v:1,t:'蓝'}]}]},
  HeartTeleport:{label:'灵魂瞬移',params:[{k:'x',t:'X',min:0,max:375,step:1},{k:'y',t:'Y',min:0,max:140,step:1}]},
  HeartMaxFallSpeed:{label:'下落速度',params:[{k:'spd',t:'速度',min:100,max:2000,step:50}]},
  SansSlam:{label:'重力砸击',params:[{k:'dir',t:'方向',opts:[{v:0,t:'右'},{v:1,t:'下'},{v:2,t:'左'},{v:3,t:'上'}]}]},
  SansSlamDamage:{label:'砸击伤害',params:[{k:'on',t:'开关',opts:[{v:0,t:'关'},{v:1,t:'开'}]}]},
  DamagePlayer:{label:'伤害玩家',params:[{k:'dmg',t:'伤害',min:1,max:20,step:1}]},
  CombatZoneResize:{label:'战斗框',params:[{k:'l',t:'左',min:0,max:640,step:1},{k:'t',t:'上',min:0,max:480,step:1},{k:'r',t:'右',min:0,max:640,step:1},{k:'b',t:'下',min:0,max:480,step:1}]},
  CombatZoneResizeInstant:{label:'瞬变战斗框',params:[{k:'l',t:'左',min:0,max:640,step:1},{k:'t',t:'上',min:0,max:480,step:1},{k:'r',t:'右',min:0,max:640,step:1},{k:'b',t:'下',min:0,max:480,step:1}]},

function setStatus(m){document.getElementById('statusBar').textContent=m;}
function num(v){return parseFloat(v)||0;}
function colorOf(c){if(c===1)return'#4488ff';if(c===2)return'#ff8844';return'#fff';}

function pushUndo(){
  State.undoStack.push(JSON.parse(JSON.stringify(State.commands)));
  if(State.undoStack.length>50)State.undoStack.shift();
}
function undo(){
  if(State.undoStack.length===0){setStatus('没有可撤销的操作');return;}

/* ==================== 画布 ==================== */
function resizeCanvas(){
  const c=document.getElementById('canvas'),w=document.getElementById('canvasArea');
  if(!c||!w)return;
  const pad=32,maxW=w.clientWidth-pad,maxH=w.clientHeight-pad;
  if(maxW<=0||maxH<=0)return;
  const r=State.zoneW/State.zoneH;let cw=maxW,ch=cw/r;
  if(ch>maxH){ch=maxH;cw=ch*r;}
  c.width=Math.round(cw);c.height=Math.round(ch);
  c.style.width=Math.round(cw)+'px';c.style.height=Math.round(ch)+'px';
  document.getElementById('canvasInfo').textContent=State.zoneW+' × '+State.zoneH;
}

function drawCanvas(){
  const c=document.getElementById('canvas');if(!c)return;
  const ctx=c.getContext('2d');const w=c.width,h=c.height;
  ctx.clearRect(0,0,w,h);ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;
  for(let i=1;i<20;i++){
    const gx=i/20*w,gy=i/20*h;
    ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke();
  }
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(1,1,w-2,h-2);
  ctx.strokeStyle='#333';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
  State.commands.forEach((cmd,i)=>{
    if(!isDrawable(cmd.func))return;
    drawPreview(ctx,cmd,i,w,h);
  });
  if(State.selectedIndex>=0&&State.selectedIndex<State.commands.length){
    const bbox=getBBox(State.commands[State.selectedIndex],w,h);
    if(bbox){
      ctx.save();
      ctx.strokeStyle='#ffcc44';ctx.lineWidth=2;ctx.setLineDash([6,4]);
      ctx.strokeRect(bbox.x-4,bbox.y-4,bbox.w+8,bbox.h+8);
      ctx.setLineDash([]);
      ctx.fillStyle='#ffcc44';
      [[bbox.x-4,bbox.y-4],[bbox.x+bbox.w+4,bbox.y-4],[bbox.x-4,bbox.y+bbox.h+4],[bbox.x+bbox.w+4,bbox.y+bbox.h+4]].forEach(([px,py])=>{
        ctx.fillRect(px-4,py-4,8,8);
      });
      ctx.restore();
    }
  }
}

function isDrawable(fn){
  return ['BoneH','BoneV','BoneHRepeat','BoneVRepeat','BoneStab','GasterBlaster','HeartTeleport','SansSlam','Platform'].includes(fn);
}

function getBBox(cmd,w,h){
  const sx=v=>num(v)/State.zoneW*w,sy=v=>num(v)/State.zoneH*h;
  const sX=w/State.zoneW,sY=h/State.zoneH;
  switch(cmd.func){
    case'BoneH':{
      const x=sx(cmd.args.x),y=sy(cmd.args.y),len=num(cmd.args.len)*sX;
      return {x,y:y-6,w:len,h:12};
    }
    case'BoneV':{
      const x=sx(cmd.args.x),y=sy(cmd.args.y),len=num(cmd.args.len)*sY;
      return {x:x-6,y,w:12,h:len};
    }
    case'BoneHRepeat':{
      const x=sx(cmd.args.x),y=sy(cmd.args.y),len=num(cmd.args.len)*sX;
      const cnt=num(cmd.args.cnt),gap=num(cmd.args.gap)*sY;
      return {x,y:y-6,w:len,h:Math.max(12,(cnt-1)*gap+12)};
    }
    case'BoneVRepeat':{
      const x=sx(cmd.args.x),y=sy(cmd.args.y),len=num(cmd.args.len)*sY;
      const cnt=num(cmd.args.cnt),gap=num(cmd.args.gap)*sX;
      return {x:x-6,y,w:Math.max(12,(cnt-1)*gap+12),h:len};
    }
    case'GasterBlaster':{
      const x1=sx(cmd.args.sx),y1=sy(cmd.args.sy),x2=sx(cmd.args.ex),y2=sy(cmd.args.ey);
      return {x:Math.min(x1,x2)-12,y:Math.min(y1,y2)-12,w:Math.abs(x2-x1)+24,h:Math.abs(y2-y1)+24};
    }
    case'HeartTeleport':{
      const x=sx(cmd.args.x),y=sy(cmd.args.y);
      return {x:x-14,y:y-14,w:28,h:28};
    }
    case'Platform':{
      const x=sx(cmd.args.x),y=sy(cmd.args.y),ww=num(cmd.args.w)*sX;
      return {x,y:y-6,w:ww,h:12};
    }
    case'BoneStab':{
      const dir=num(cmd.args.dir),dist=num(cmd.args.dist);
      const d=dist/State.zoneW*w,dh=dist/State.zoneH*h;
      if(dir===0)return{x:0,y:0,w:d,h};
      if(dir===1)return{x:0,y:0,w,h:dh};
      if(dir===2)return{x:w-d,y:0,w:d,h};
      if(dir===3)return{x:0,y:h-dh,w,h:dh};
      return null;
    }
    case'SansSlam':{
      return {x:w/2-14,y:h/2-14,w:28,h:28};
    }
    default: return null;
  }
}

function drawPreview(ctx,cmd,idx,w,h){
  const sel=(idx===State.selectedIndex);
  const sx=v=>num(v)/State.zoneW*w;
  const sy=v=>num(v)/State.zoneH*h;
  ctx.save();ctx.lineWidth=sel?4:2;
  switch(cmd.func){
    case'BoneH':
      ctx.strokeStyle=sel?'#ffcc44':colorOf(num(cmd.args.col));
      ctx.beginPath();ctx.moveTo(sx(cmd.args.x),sy(cmd.args.y));
      ctx.lineTo(sx(cmd.args.x)+num(cmd.args.len)/State.zoneW*w,sy(cmd.args.y));
      ctx.stroke();break;
    case'BoneV':
      ctx.strokeStyle=sel?'#ffcc44':colorOf(num(cmd.args.col));
      ctx.beginPath();ctx.moveTo(sx(cmd.args.x),sy(cmd.args.y));
      ctx.lineTo(sx(cmd.args.x),sy(cmd.args.y)+num(cmd.args.len)/State.zoneH*h);
      ctx.stroke();break;
    case'BoneHRepeat':{
      ctx.strokeStyle=sel?'#ffcc44':'#fff';
      const cnt=num(cmd.args.cnt),gap=num(cmd.args.gap);
      for(let i=0;i<cnt;i++){
        const yy=num(cmd.args.y)+i*gap;
        if(yy>State.zoneH)break;
        ctx.beginPath();
        ctx.moveTo(sx(cmd.args.x),sy(yy));
        ctx.lineTo(sx(cmd.args.x)+num(cmd.args.len)/State.zoneW*w,sy(yy));
        ctx.stroke();
      }
      break;
    }
    case'BoneVRepeat':{
      ctx.strokeStyle=sel?'#ffcc44':'#fff';
      const cnt=num(cmd.args.cnt),gap=num(cmd.args.gap);
      for(let i=0;i<cnt;i++){
        const xx=num(cmd.args.x)+i*gap;
        if(xx>State.zoneW)break;
        ctx.beginPath();
        ctx.moveTo(sx(xx),sy(cmd.args.y));
        ctx.lineTo(sx(xx),sy(cmd.args.y)+num(cmd.args.len)/State.zoneH*h);
        ctx.stroke();
      }
      break;
    }
    case'BoneStab':{
      ctx.strokeStyle=sel?'#ffcc44':'#ff8844';ctx.fillStyle='rgba(255,136,68,.15)';
      const dir=num(cmd.args.dir),dist=num(cmd.args.dist);
      const d=dist/State.zoneW*w,dh=dist/State.zoneH*h;
      ctx.beginPath();
      if(dir===0)ctx.rect(0,0,d,h);
      else if(dir===1)ctx.rect(0,0,w,dh);
      else if(dir===2)ctx.rect(w-d,0,d,h);
      else if(dir===3)ctx.rect(0,h-dh,w,dh);
      ctx.fill();ctx.stroke();
      break;
    }
    case'GasterBlaster':{
      const size=num(cmd.args.size);
      ctx.strokeStyle=sel?'#ffcc44':'#66ddff';ctx.fillStyle='rgba(102,221,255,.2)';
      ctx.beginPath();ctx.arc(sx(cmd.args.sx),sy(cmd.args.sy),6+size*2,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.arc(sx(cmd.args.ex),sy(cmd.args.ey),6+size*2,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(sx(cmd.args.sx),sy(cmd.args.sy));
      ctx.lineTo(sx(cmd.args.ex),sy(cmd.args.ey));ctx.stroke();ctx.setLineDash([]);
      break;
    }
    case'HeartTeleport':{
      ctx.strokeStyle=sel?'#ffcc44':'#ff4466';
      ctx.beginPath();ctx.arc(sx(cmd.args.x),sy(cmd.args.y),10,0,Math.PI*2);ctx.stroke();
      break;
    }
    case'SansSlam':{
      ctx.strokeStyle=sel?'#ffcc44':'#ffcc44';const cx=w/2,cy=h/2;
      const dir=num(cmd.args.dir);let tx=cx,ty=cy;
      if(dir===0)tx=w;else if(dir===1)ty=h;else if(dir===2)tx=0;else if(dir===3)ty=0;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(tx,ty);ctx.stroke();
      break;
    }
    case'Platform':{
      ctx.strokeStyle=sel?'#ffcc44':'#88ff88';ctx.fillStyle='rgba(136,255,136,.15)';
      const x=sx(cmd.args.x),y=sy(cmd.args.y),ww=num(cmd.args.w)/State.zoneW*w;
      ctx.fillRect(x,y,ww,6);ctx.strokeRect(x,y,ww,6);
      break;
    }
  }
  ctx.restore();
}

function hitTest(mx,my){
  const c=document.getElementById('canvas');
  const w=c.width,h=c.height;
  for(let i=State.commands.length-1;i>=0;i--){
    const cmd=State.commands[i];
    const bbox=getBBox(cmd,w,h);
    if(!bbox)continue;
    if(mx>=bbox.x-8&&mx<=bbox.x+bbox.w+8&&my>=bbox.y-8&&my<=bbox.y+bbox.h+8)return i;
  }
  return -1;
}

function buildBottomTools(){
  const wrap=document.getElementById('bottomTools');
  const tools=[['BoneH','骨头H'],['BoneV','骨头V'],['BoneHRepeat','横阵列'],['BoneVRepeat','竖阵列'],['BoneStab','骨墙'],['GasterBlaster','龙骨炮'],['HeartMode','灵魂'],['HeartTeleport','瞬移'],['SansHead','Sans头'],['SansBody','Sans身'],['SansSlam','重力'],['Sound','音效'],['BlackScreen','黑屏'],['Platform','平台']];
  wrap.innerHTML=tools.map(([k,t])=>{
    const def=CMD_DEFS[k];
    return `<div class="tool-btn" data-tool="${k}"><span class="tn">${t}</span><span class="tc">${def?def.label:k}</span></div>`;
  }).join('');
  wrap.querySelectorAll('.tool-btn').forEach(el=>{

      ghost.classList.add('show');

function onDragMove(e){
  if(!State.dragTool)return;
  const ghost=document.getElementById('dragGhost');
  ghost.style.left=e.clientX+'px';
  ghost.style.top=e.clientY+'px';
}

function onDragEnd(e){
  document.removeEventListener('pointermove',onDragMove);
  if(!State.dragTool)return;
  const ghost=document.getElementById('dragGhost');
  ghost.classList.remove('show');
  const c=document.getElementById('canvas');
  if(!c||c.width===0||c.height===0){
    setStatus('画布未就绪，先切到拖拽模式');
    State.dragTool=null;
    return;
  }
  const rect=c.getBoundingClientRect();
  if(rect.width===0||rect.height===0){
    setStatus('画布尺寸为 0，先切到拖拽模式');
    State.dragTool=null;
    return;
  }
  if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom){
    const x=Math.round((e.clientX-rect.left)/rect.width*State.zoneW);
    const y=Math.round((e.clientY-rect.top)/rect.height*State.zoneH);
    createAt(State.dragTool,x,y);
  } else {
    setStatus('拖到画布内才能放置');
  }
  State.dragTool=null;
}

function createAt(fn,x,y){
  const def=CMD_DEFS[fn];if(!def)return;
  pushUndo();
  const args={};
  def.params.forEach(p=>{
    if(p.k==='x'||p.k==='sx')args[p.k]=x;
    else if(p.k==='y'||p.k==='sy')args[p.k]=y;
    else if(p.k==='ex')args[p.k]=x;
    else if(p.k==='ey')args[p.k]=y;
    else if(p.min!==undefined)args[p.k]=p.min;
    else if(p.opts)args[p.k]=p.opts[0].v;
    else args[p.k]='';
  });
  const delay=0;
  State.commands.push({func:fn,args,delay});
  const rule=AUTO_SOUND[fn];
  if(rule&&rule.cond(args)){
    State.commands.push({func:'Sound',args:{name:rule.sound,spd:0},delay});
  }
  State.selectedIndex=State.commands.length-1;
  renderAll();
  setStatus('已创建 '+def.label+' @ ('+x+','+y+')');
}

function setupCanvasInteraction(){
  const c=document.getElementById('canvas');
  c.addEventListener('pointerdown',e=>{
    const rect=c.getBoundingClientRect();
    const mx=(e.clientX-rect.left)/rect.width*c.width;
    const my=(e.clientY-rect.top)/rect.height*c.height;
    const idx=hitTest(mx,my);
    if(idx>=0){
      pushUndo();
      State.selectedIndex=idx;
      State.dragging={
        type:'move',index:idx,
        startX:e.clientX,startY:e.clientY,
        origArgs:JSON.parse(JSON.stringify(State.commands[idx].args))
      };
      c.setPointerCapture(e.pointerId);
      renderAll();
    } else {
      State.selectedIndex=-1;
      renderAll();
    }
  });
  c.addEventListener('pointermove',e=>{
    if(!State.dragging||State.dragging.type!=='move')return;
    const rect=c.getBoundingClientRect();
    const dx=(e.clientX-State.dragging.startX)/rect.width*State.zoneW;
    const dy=(e.clientY-State.dragging.startY)/rect.height*State.zoneH;
    const cmd=State.commands[State.dragging.index];
    if(!cmd)return;
    const orig=State.dragging.origArgs;
    if(cmd.func==='GasterBlaster'){
      cmd.args.sx=Math.round(num(orig.sx)+dx);
      cmd.args.sy=Math.round(num(orig.sy)+dy);
      cmd.args.ex=Math.round(num(orig.ex)+dx);
      cmd.args.ey=Math.round(num(orig.ey)+dy);
    } else if(['BoneH','BoneV','BoneHRepeat','BoneVRepeat','HeartTeleport','Platform'].includes(cmd.func)){
      cmd.args.x=Math.round(num(orig.x)+dx);
      cmd.args.y=Math.round(num(orig.y)+dy);
    }
    drawCanvas();
  });
  c.addEventListener('pointerup',e=>{
    if(State.dragging&&State.dragging.type==='move'){
      const rect=c.getBoundingClientRect();
      const outside=e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom;
      if(outside){
        const idx=State.dragging.index;
        State.commands.splice(idx,1);
        State.selectedIndex=-1;
        setStatus('已删除（拖出画布）');
      }
      State.dragging=null;
      renderAll();
    }
  });
}

/* ==================== 时间轴 ==================== */
function renderTimeline(){
  const track=document.getElementById('timelineTrack');
  track.querySelectorAll('.tl-block').forEach(b=>b.remove());
  if(State.commands.length===0)return;
  let total=0;
  State.commands.forEach(c=>total+=num(c.delay));
  total=Math.max(total,3);
  const pxPerSec=60;
  const width=total*pxPerSec+40;
  track.style.width=width+'px';
  let acc=0;
  State.commands.forEach((cmd,i)=>{
    acc+=num(cmd.delay);
    const left=acc*pxPerSec;
    const def=CMD_DEFS[cmd.func];
    const label=def?def.label:cmd.func;
    const isSound=cmd.func==='Sound';
    const block=document.createElement('div');
    block.className='tl-block'+(i===State.selectedIndex?' selected':'')+(isSound?' sound':'');
    block.style.left=left+'px';
    block.style.width=Math.max(50,label.length*13)+'px';
    block.textContent=label;
    block.dataset.i=i;
    block.addEventListener('pointerdown',e=>{
      e.stopPropagation();
      pushUndo();
      State.selectedIndex=i;
      State.dragging={
        type:'timeline',index:i,
        startX:e.clientX,
        origDelay:num(cmd.delay)
      };
      block.setPointerCapture(e.pointerId);
      renderAll();
    });
    block.addEventListener('pointermove',e=>{
      if(!State.dragging||State.dragging.type!=='timeline')return;
      if(State.dragging.index!==i)return;
      const dx=e.clientX-State.dragging.startX;
      const dSec=dx/pxPerSec;
      cmd.delay=Math.max(0,Math.round((State.dragging.origDelay+dSec)*10)/10);
      renderTimeline();renderParamBar();
    });
    block.addEventListener('pointerup',()=>{
      State.dragging=null;
      renderAll();
    });
    track.appendChild(block);
  });
}

/* ==================== 拖拽模式播放 ==================== */
function play(){
  if(State.commands.length===0){setStatus('没有指令');return;}
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:#000;z-index:3000;display:flex;flex-direction:column';
  overlay.innerHTML=`
    <div style="padding:12px 16px;background:#141414;border-bottom:2px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:16px;font-weight:600">模拟播放</span>
      <button class="btn" id="playClose">关闭</button>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px" id="playWrap"><canvas id="playCanvas"></canvas></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#playClose').onclick=()=>{
    overlay.remove();State.playing=false;if(State.playRAF)cancelAnimationFrame(State.playRAF);
  };
  State.playing=true;State.playStart=performance.now();
  const loop=()=>{
    if(!State.playing)return;
    const c=document.getElementById('playCanvas');if(!c)return;
    const wrap=c.parentElement;
    const pad=40,maxW=wrap.clientWidth-pad,maxH=wrap.clientHeight-pad;
    const r=State.zoneW/State.zoneH;let w=maxW,h=w/r;if(h>maxH){h=maxH;w=h*r;}
    if(c.width!==Math.round(w)){c.width=Math.round(w);c.height=Math.round(h);c.style.width=Math.round(w)+'px';c.style.height=Math.round(h)+'px';}
    const ctx=c.getContext('2d');const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,cw,ch);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(1,1,cw-2,ch-2);
    const elapsed=(performance.now()-State.playStart)/1000;
    let acc=0;
    State.commands.forEach(cmd=>{
      acc+=num(cmd.delay);
      if(acc>elapsed)return;
      drawPlayCmd(ctx,cmd,elapsed-acc,cw,ch);
    });
    State.playRAF=requestAnimationFrame(loop);
  };
  loop();
}

function drawPlayCmd(ctx,cmd,lt,w,h){
  const sx=v=>num(v)/State.zoneW*w,sy=v=>num(v)/State.zoneH*h;
  const sX=w/State.zoneW,sY=h/State.zoneH;
  ctx.save();ctx.lineWidth=3;
  switch(cmd.func){
    case'BoneH':{
      const x=num(cmd.args.x)+num(cmd.args.spd)*lt;if(x>State.zoneW+100)return;
      ctx.strokeStyle=colorOf(num(cmd.args.col));
      ctx.beginPath();ctx.moveTo(sx(x),sy(cmd.args.y));ctx.lineTo(sx(x)+num(cmd.args.len)*sX,sy(cmd.args.y));ctx.stroke();
      break;
    }
    case'BoneV':{
      const y=num(cmd.args.y)+num(cmd.args.spd)*lt;if(y>State.zoneH+100)return;
      ctx.strokeStyle=colorOf(num(cmd.args.col));
      ctx.beginPath();ctx.moveTo(sx(cmd.args.x),sy(y));ctx.lineTo(sx(cmd.args.x),sy(y)+num(cmd.args.len)*sY);ctx.stroke();
      break;
    }
    case'BoneHRepeat':{
      const x=num(cmd.args.x)+num(cmd.args.spd)*lt;if(x>State.zoneW+200)return;
      ctx.strokeStyle='#fff';
      const cnt=num(cmd.args.cnt),gap=num(cmd.args.gap);
      for(let i=0;i<cnt;i++){
        const yy=num(cmd.args.y)+i*gap;if(yy>State.zoneH)break;
        ctx.beginPath();ctx.moveTo(sx(x),sy(yy));ctx.lineTo(sx(x)+num(cmd.args.len)*sX,sy(yy));ctx.stroke();
      }
      break;
    }
    case'BoneVRepeat':{
      const y=num(cmd.args.y)+num(cmd.args.spd)*lt;if(y>State.zoneH+200)return;
      ctx.strokeStyle='#fff';
      const cnt=num(cmd.args.cnt),gap=num(cmd.args.gap);
      for(let i=0;i<cnt;i++){
        const xx=num(cmd.args.x)+i*gap;if(xx>State.zoneW)break;
        ctx.beginPath();ctx.moveTo(sx(xx),sy(y));ctx.lineTo(sx(xx),sy(y)+num(cmd.args.len)*sY);ctx.stroke();
      }
      break;
    }
    case'BoneStab':{
      const warn=num(cmd.args.warn),stay=num(cmd.args.stay);
      if(lt<warn)return;if(lt-warn>stay)return;
      ctx.strokeStyle='#ff8844';ctx.fillStyle='rgba(255,136,68,.3)';
      const dir=num(cmd.args.dir),dist=num(cmd.args.dist);
      const d=dist*sX,dh=dist*sY;
      ctx.beginPath();
      if(dir===0)ctx.rect(0,0,d,h);else if(dir===1)ctx.rect(0,0,w,dh);
      else if(dir===2)ctx.rect(w-d,0,d,h);else if(dir===3)ctx.rect(0,h-dh,w,dh);
      ctx.fill();ctx.stroke();
      break;
    }
    case'GasterBlaster':{
      const spin=num(cmd.args.spin),blast=num(cmd.args.blast);
      if(lt<spin+blast){
        ctx.strokeStyle='#66ddff';const size=num(cmd.args.size);
        ctx.beginPath();ctx.arc(sx(cmd.args.sx),sy(cmd.args.sy),8+size*3,0,Math.PI*2);ctx.stroke();
      }
      break;
    }
  }
  ctx.restore();
}

/* ==================== CSV 导入导出 ==================== */
function buildCSV(){
  if(State.commands.length===0)return'';
  const lines=['0,CombatZoneResize,133,251,508,391,TLResume','0,HeartTeleport,320,304','0,Music,mus_zz_megalovania'];
  let acc=0;
  State.commands.forEach(cmd=>{
    acc+=num(cmd.delay);
    const def=CMD_DEFS[cmd.func];
    const parts=[acc,cmd.func];
    if(def&&def.params.length)def.params.forEach(p=>parts.push(cmd.args[p.k]!==undefined?cmd.args[p.k]:0));
    lines.push(parts.join(','));
  });
  if(!State.commands.some(c=>c.func==='EndAttack'))lines.push((acc+5)+',EndAttack');
  return lines.join('\n');
}

function saveCSV(){
  let csv;
  if(State.mode==='script'){
    csv=document.getElementById('scriptEditor').value.trim();
    if(!csv){setStatus('脚本为空');return;}
  } else {
    csv=buildCSV();
    if(!csv){setStatus('没有指令');return;}
  }
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='attack.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  setStatus('已导出 attack.csv');
}

function importCSV(){
  const input=document.createElement('input');input.type='file';input.accept='.csv';
  input.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      if(State.mode==='script'){
        document.getElementById('scriptEditor').value=ev.target.result;
        updateLineNums();syncGraphFromText();
        setStatus('已导入到脚本编辑器');
      } else {
        parseCSVToCommands(ev.target.result);
      }
    };
    r.readAsText(f);
  };
  input.click();
}

function parseCSVToCommands(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
  let n=0,prevTime=0;
  const imported=[];
  lines.forEach(line=>{
    const cols=line.split(',').map(s=>s.trim());if(cols.length<2)return;
    const time=parseFloat(cols[0]),fn=cols[1];if(isNaN(time)||!fn)return;
    const def=CMD_DEFS[fn];if(!def)return;
    const args={};def.params.forEach((p,i)=>{args[p.k]=cols[i+2]!==undefined?cols[i+2]:0;});
    let d=time-prevTime;if(d<0)d=0;
    imported.push({func:fn,args,delay:d});
    prevTime=time;n++;
  });
  pushUndo();
  State.commands=imported;
  State.selectedIndex=-1;
  renderAll();
  setStatus('已导入 '+n+' 条指令');
}

/* ==================== 编写模式：补全 ==================== */
let acItems=[],acIndex=0,acWordStart=0;
const AUTOCOMPLETE_EL=()=>document.getElementById('autocomplete');

function getScriptVars(){
  const text=document.getElementById('scriptEditor').value;
  const set=new Set();
  const re=/\$([A-Za-z_][A-Za-z0-9_]*)/g;
  let m;
  while((m=re.exec(text)))set.add(m[1]);
  return Array.from(set);
}

function buildCandidates(prefix){
  const out=[];
  const p=prefix.toLowerCase();
  SCRIPT_CMDS.forEach(c=>{
    if(c.toLowerCase().startsWith(p))out.push({kind:'cmd',text:c,label:c});
  });
  getScriptVars().forEach(v=>{
    const t='$'+v;
    if(t.toLowerCase().startsWith(p))out.push({kind:'var',text:t,label:t});
  });
  SNIPPETS.forEach(s=>{
    if(s.name.toLowerCase().startsWith(p))out.push({kind:'snip',text:s.text,label:s.name+' → '+s.text});
  });
  return out.slice(0,20);
}

function showAutocomplete(){
  const ed=document.getElementById('scriptEditor');
  const pos=ed.selectionStart;
  const before=ed.value.slice(0,pos);
  const m=before.match(/([A-Za-z_$][A-Za-z0-9_$]*)$/);
  if(!m)return hideAutocomplete();
  const word=m[1];
  if(word.length<1)return hideAutocomplete();
  acItems=buildCandidates(word);
  if(acItems.length===0)return hideAutocomplete();
  acWordStart=pos-word.length;
  acIndex=0;
  const ac=AUTOCOMPLETE_EL();
  ac.innerHTML=acItems.map((it,i)=>{
    const kindCls=it.kind==='cmd'?'cmd':(it.kind==='var'?'var':'snip');
    const kindLabel=it.kind==='cmd'?'指令':(it.kind==='var'?'变量':'片段');
    return `<div class="ac-item${i===0?' active':''}" data-i="${i}"><span class="ac-kind ${kindCls}">${kindLabel}</span><span>${it.label}</span></div>`;
  }).join('');
  ac.classList.add('show');
  const rect=ed.getBoundingClientRect();
  const lineHeight=13*1.6;
  const linesBefore=before.split('\n');
  const lineIdx=linesBefore.length-1;
  const colIdx=linesBefore[lineIdx].length;
  const x=rect.left+10+Math.min(colIdx,40)*7.8;
  const y=rect.top+10+(lineIdx+1)*lineHeight-ed.scrollTop;
  ac.style.left=Math.min(x,window.innerWidth-260)+'px';
  ac.style.top=Math.min(y,window.innerHeight-240)+'px';
  ac.querySelectorAll('.ac-item').forEach(el=>{
    el.onmousedown=ev=>{ev.preventDefault();applyAutocomplete(parseInt(el.dataset.i));};
  });
}

function hideAutocomplete(){AUTOCOMPLETE_EL().classList.remove('show');}

function applyAutocomplete(i){
  if(i<0||i>=acItems.length)return;
  const ed=document.getElementById('scriptEditor');
  const pos=ed.selectionStart;
  const item=acItems[i];
  const newText=ed.value.slice(0,acWordStart)+item.text+ed.value.slice(pos);
  ed.value=newText;
  const newPos=acWordStart+item.text.length;
  ed.selectionStart=ed.selectionEnd=newPos;
  ed.focus();
  hideAutocomplete();
  updateLineNums();
  if(State.scriptView==='graph')syncGraphFromText();
}

/* ==================== 图形模式 ==================== */
function syncGraphFromText(){
  const text=document.getElementById('scriptEditor').value;
  const lines=text.split('\n');
  const wrap=document.getElementById('scriptGraphWrap');
  wrap.innerHTML='';
  lines.forEach((line,idx)=>{
    if(!line.trim())return;
    const cols=line.split(',').map(s=>s.trim());
    const time=cols[0]||'0';
    const fn=cols[1]||'SET';
    const args=cols.slice(2);
    const card=document.createElement('div');
    card.className='gcard';
    card.dataset.line=idx;
    const argCount=SCRIPT_ARG_COUNT[fn]!==undefined?SCRIPT_ARG_COUNT[fn]:args.length;
    let argsHtml='';
    for(let k=0;k<argCount;k++){
      const v=args[k]!==undefined?args[k]:'';
      argsHtml+=`<div class="garg"><input data-k="${k}" value="${v.replace(/"/g,'&quot;')}" placeholder="参数${k+1}"><button class="vbtn" data-k="${k}" title="插入变量">$</button></div>`;
    }
    card.innerHTML=`
      <div class="gline">${idx}</div>
      <div class="gtime"><input data-k="__time__" value="${time}"></div>
      <div class="gfunc"><select data-k="__func__">${SCRIPT_CMDS.map(c=>`<option value="${c}"${c===fn?' selected':''}>${c}</option>`).join('')}</select></div>
      <div class="gargs">${argsHtml}</div>
      <div class="gops">
        <button data-op="up" title="上移">↑</button>
        <button data-op="down" title="下移">↓</button>
        <button data-op="del" class="del" title="删除">×</button>
      </div>`;
    wrap.appendChild(card);
  });
  wrap.querySelectorAll('.gcard').forEach(card=>{
    const lineIdx=parseInt(card.dataset.line);
    card.querySelectorAll('input,select').forEach(inp=>{
      inp.onchange=()=>writeGraphToText();
    });
    card.querySelectorAll('.vbtn').forEach(btn=>{
      btn.onclick=e=>{
        e.preventDefault();
        showVarPicker(btn,lineIdx,parseInt(btn.dataset.k));
      };
    });
    card.querySelectorAll('.gops button').forEach(btn=>{
      btn.onclick=()=>{
        const op=btn.dataset.op;
        const lines=document.getElementById('scriptEditor').value.split('\n');
        const realIdx=findRealLineIndex(lines,lineIdx);
        if(realIdx<0)return;
        if(op==='del'){
          lines.splice(realIdx,1);
        } else if(op==='up'&&realIdx>0){
          const t=lines[realIdx-1];lines[realIdx-1]=lines[realIdx];lines[realIdx]=t;
        } else if(op==='down'&&realIdx<lines.length-1){
          const t=lines[realIdx+1];lines[realIdx+1]=lines[realIdx];lines[realIdx]=t;
        }
        document.getElementById('scriptEditor').value=lines.join('\n');
        updateLineNums();
        syncGraphFromText();
      };
    });
  });
}

function findRealLineIndex(lines,visibleIdx){
  let n=-1;
  for(let i=0;i<lines.length;i++){
    if(lines[i].trim()){n++;if(n===visibleIdx)return i;}
  }
  return -1;
}

function writeGraphToText(){
  const wrap=document.getElementById('scriptGraphWrap');
  const cards=Array.from(wrap.querySelectorAll('.gcard'));
  const lines=cards.map(card=>{
    const time=card.querySelector('[data-k="__time__"]').value.trim();
    const fn=card.querySelector('[data-k="__func__"]').value;
    const args=Array.from(card.querySelectorAll('.gargs input')).map(i=>i.value.trim());
    while(args.length&&args[args.length-1]==='')args.pop();
    return [time,fn,...args].join(',');
  });
  document.getElementById('scriptEditor').value=lines.join('\n');
  updateLineNums();
}

/* ==================== 脚本预览执行器 ==================== */
function parseScriptLines(text){
  return text.split('\n').map((line,idx)=>{
    if(!line.trim())return null;
    const cols=line.split(',').map(s=>s.trim());
    const time=parseFloat(cols[0]);
    const fn=cols[1];
    if(isNaN(time)||!fn)return null;
    return {lineIdx:idx,time,fn,args:cols.slice(2)};
  });
}

function evalVal(token,vars){
  if(token===undefined||token===null)return 0;
  const s=String(token).trim();
  if(s==='')return 0;
  if(s.startsWith('$')){
    const name=s.slice(1);
    return vars[name]!==undefined?vars[name]:0;
  }
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}

function setVar(vars,name,val){
  if(name&&name.startsWith('$'))name=name.slice(1);
  vars[name]=val;
}

function runScriptPreview(){
  stopScriptPreview();
  const text=document.getElementById('scriptEditor').value;
  const lines=parseScriptLines(text);
  const validLines=lines.filter(Boolean);
  if(validLines.length===0){document.getElementById('scriptStatus').textContent='没有有效指令';return;}
  const lineIndexMap={};
  validLines.forEach((l,pos)=>{lineIndexMap[l.lineIdx]=pos;});

  const vars={};
  let zoneL=0,zoneT=0,zoneR=State.zoneW,zoneB=State.zoneH;
  State.heartX=(zoneL+zoneR)/2;
  State.heartY=(zoneT+zoneB)/2;
  State.scriptZone={l:zoneL,t:zoneT,r:zoneR,b:zoneB};

  const events=[];
  const visibleGbs=[];
  let pc=0;
  let simTime=0;
  let steps=0;
  const MAX_STEPS=200000;

  while(pc<validLines.length&&steps<MAX_STEPS){
    steps++;
    const ln=validLines[pc];
    const t=ln.time;
    simTime=Math.max(simTime,t);
    let jumped=false;
    switch(ln.fn){
      case'SET':{setVar(vars,ln.args[0],evalVal(ln.args[1],vars));break;}
      case'ADD':{setVar(vars,ln.args[0],evalVal(ln.args[1],vars)+evalVal(ln.args[2],vars));break;}
      case'SUB':{setVar(vars,ln.args[0],evalVal(ln.args[1],vars)-evalVal(ln.args[2],vars));break;}
      case'MUL':{setVar(vars,ln.args[0],evalVal(ln.args[1],vars)*evalVal(ln.args[2],vars));break;}
      case'DIV':{const d=evalVal(ln.args[2],vars);setVar(vars,ln.args[0],d===0?0:evalVal(ln.args[1],vars)/d);break;}
      case'MOD':{const d=evalVal(ln.args[2],vars);setVar(vars,ln.args[0],d===0?0:evalVal(ln.args[1],vars)%d);break;}
      case'COS':{setVar(vars,ln.args[0],Math.cos(evalVal(ln.args[1],vars)*Math.PI/180));break;}
      case'SIN':{setVar(vars,ln.args[0],Math.sin(evalVal(ln.args[1],vars)*Math.PI/180));break;}
      case'RND':{const max=evalVal(ln.args[1],vars);setVar(vars,ln.args[0],Math.floor(Math.random()*max));break;}
      case'GetHeartPos':{
        setVar(vars,ln.args[0],State.heartX);
        setVar(vars,ln.args[1],State.heartY);
        break;
      }
      case'ANGLE':{const x1=evalVal(ln.args[1],vars),y1=evalVal(ln.args[2],vars),x2=evalVal(ln.args[3],vars),y2=evalVal(ln.args[4],vars);setVar(vars,ln.args[0],Math.atan2(y2-y1,x2-x1)*180/Math.PI);break;}
      case'JMP':{const target=Math.floor(evalVal(ln.args[0],vars));if(lineIndexMap[target]!==undefined){pc=lineIndexMap[target];jumped=true;}break;}
      case'JMPNZ':{const target=Math.floor(evalVal(ln.args[0],vars));const v=evalVal(ln.args[1],vars);if(v!==0&&lineIndexMap[target]!==undefined){pc=lineIndexMap[target];jumped=true;}break;}
      case'JMPZ':{const target=Math.floor(evalVal(ln.args[0],vars));const v=evalVal(ln.args[1],vars);if(v===0&&lineIndexMap[target]!==undefined){pc=lineIndexMap[target];jumped=true;}break;}
      case'JMPNL':{const target=Math.floor(evalVal(ln.args[0],vars));const v=evalVal(ln.args[1],vars);const cmp=evalVal(ln.args[2],vars);if(v<cmp&&lineIndexMap[target]!==undefined){pc=lineIndexMap[target];jumped=true;}break;}
      case'JMPNG':{const target=Math.floor(evalVal(ln.args[0],vars));const v=evalVal(ln.args[1],vars);const cmp=evalVal(ln.args[2],vars);if(v>cmp&&lineIndexMap[target]!==undefined){pc=lineIndexMap[target];jumped=true;}break;}
      case'CombatZoneResize':
      case'CombatZoneResizeInstant':{
        const l=evalVal(ln.args[0],vars),t2=evalVal(ln.args[1],vars),r=evalVal(ln.args[2],vars),b=evalVal(ln.args[3],vars);
        zoneL=l;zoneT=t2;zoneR=r;zoneB=b;
        State.heartX=Math.max(l+10,Math.min(r-10,State.heartX));
        State.heartY=Math.max(t2+10,Math.min(b-10,State.heartY));
        State.scriptZone={l:zoneL,t:zoneT,r:zoneR,b:zoneB};
        events.push({time:t,fn:()=>{}});
        break;
      }
      case'HeartTeleport':{
        const hx=evalVal(ln.args[0],vars),hy=evalVal(ln.args[1],vars);
        State.heartX=hx;State.heartY=hy;
        events.push({time:t,fn:()=>{}});
        break;
      }
      case'GasterBlaster':{
        const size=evalVal(ln.args[0],vars),sx=evalVal(ln.args[1],vars),sy=evalVal(ln.args[2],vars);
        const ex=evalVal(ln.args[3],vars),ey=evalVal(ln.args[4],vars),ang=evalVal(ln.args[5],vars);
        const spin=evalVal(ln.args[6],vars),blast=evalVal(ln.args[7],vars);
        events.push({time:t,fn:()=>{visibleGbs.push({sx,sy,ex,ey,ang,spin,blast,size,born:t});}});
        break;
      }
      case'BoneH':case'BoneV':case'BoneHRepeat':case'BoneVRepeat':case'BoneStab':case'Platform':case'SansSlam':
      case'TLPause':case'TLResume':case'EndAttack':case'Sound':case'Music':case'BlackScreen':
      case'SansHead':case'SansBody':case'SansTorso':case'SansAnimation':case'SansSweat':case'SansX':case'SansText':
      case'HeartMode':case'HeartMaxFallSpeed':case'SansSlamDamage':case'DamagePlayer':
      default:{
        events.push({time:t,fn:()=>{}});
        break;
      }
    }
    if(!jumped)pc++;
    if(events.length>50000)break;
  }
  const endTime=simTime+3;

  State.scriptPlaying=true;
  State.scriptStart=performance.now();
  State.lastVars=vars;
  renderVars(vars);
  document.getElementById('scriptStatus').textContent='运行中… 事件数 '+events.length+' 步数 '+steps+'（可拖灵魂）';

  const c=document.getElementById('scriptCanvas');
  const wrap=c.parentElement;
  const loop=()=>{
    if(!State.scriptPlaying)return;
    const pad=40,maxW=wrap.clientWidth-pad,maxH=wrap.clientHeight-pad;
    const r=State.zoneW/State.zoneH;let w=maxW,h=w/r;if(h>maxH){h=maxH;w=h*r;}
    if(c.width!==Math.round(w)){c.width=Math.round(w);c.height=Math.round(h);c.style.width=Math.round(w)+'px';c.style.height=Math.round(h)+'px';}
    const ctx=c.getContext('2d');const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,cw,ch);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(1,1,cw-2,ch-2);
    const elapsed=(performance.now()-State.scriptStart)/1000;
    const zl=State.scriptZone.l/State.zoneW*cw,zt=State.scriptZone.t/State.zoneH*ch;
    const zr=State.scriptZone.r/State.zoneW*cw,zb=State.scriptZone.b/State.zoneH*ch;
    ctx.strokeStyle='#4a6cf7';ctx.lineWidth=1;ctx.strokeRect(zl,zt,zr-zl,zb-zt);
    const hx=State.heartX/State.zoneW*cw,hy=State.heartY/State.zoneH*ch;
    ctx.fillStyle='#ff4466';ctx.beginPath();ctx.arc(hx,hy,7,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ff8899';ctx.lineWidth=1;ctx.beginPath();ctx.arc(hx,hy,11,0,Math.PI*2);ctx.stroke();
    visibleGbs.forEach(gb=>{
      if(elapsed<gb.born)return;
      const lt=elapsed-gb.born;
      if(lt<gb.spin+gb.blast){
        const size=gb.size;
        const px=gb.sx/State.zoneW*cw,py=gb.sy/State.zoneH*ch;
        ctx.strokeStyle='#66ddff';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(px,py,8+size*3,0,Math.PI*2);ctx.stroke();
        const ex=gb.ex/State.zoneW*cw,ey=gb.ey/State.zoneH*ch;
        ctx.beginPath();ctx.arc(ex,ey,6+size*2,0,Math.PI*2);ctx.stroke();
        ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);
      }
    });
    if(elapsed>endTime){
      State.scriptPlaying=false;
      document.getElementById('scriptStatus').textContent='播放结束 · 事件数 '+events.length;
      return;
    }
    State.scriptRAF=requestAnimationFrame(loop);
  };
  loop();
}

function stopScriptPreview(){
  State.scriptPlaying=false;
  if(State.scriptRAF)cancelAnimationFrame(State.scriptRAF);
}

function renderVars(vars){
  const el=document.getElementById('scriptVars');
  const keys=Object.keys(vars).sort();
  if(keys.length===0){el.innerHTML='<span style="color:#555">（无变量）</span>';return;}
  el.innerHTML=keys.map(k=>`<span class="vname">$${k}</span>=<span class="vval">${typeof vars[k]==='number'?(Math.round(vars[k]*1000)/1000):vars[k]}</span>`).join(' &nbsp; ');
}

/* ==================== 脚本画布：拖灵魂 ==================== */
function setupScriptCanvasInteraction(){
  const c=document.getElementById('scriptCanvas');
  c.addEventListener('pointerdown',e=>{
    if(!State.scriptPlaying)return;
    const rect=c.getBoundingClientRect();
    const mx=(e.clientX-rect.left)/rect.width*State.zoneW;
    const my=(e.clientY-rect.top)/rect.height*State.zoneH;
    const dx=mx-State.heartX,dy=my-State.heartY;
    const hitPx=40;
    const dxPx=dx/State.zoneW*rect.width,dyPx=dy/State.zoneH*rect.height;
    if(dxPx*dxPx+dyPx*dyPx<hitPx*hitPx){
      State.draggingHeart=true;
      c.setPointerCapture(e.pointerId);
      c.style.cursor='grabbing';
    }
  });
  c.addEventListener('pointermove',e=>{
    if(!State.draggingHeart)return;
    const rect=c.getBoundingClientRect();
    let mx=(e.clientX-rect.left)/rect.width*State.zoneW;
    let my=(e.clientY-rect.top)/rect.height*State.zoneH;
    const z=State.scriptZone;
    mx=Math.max(z.l+8,Math.min(z.r-8,mx));
    my=Math.max(z.t+8,Math.min(z.b-8,my));
    State.heartX=mx;State.heartY=my;
    renderVars(State.lastVars);
  });
  c.addEventListener('pointerup',()=>{
    State.draggingHeart=false;
    c.style.cursor='grab';
  });
  c.addEventListener('pointercancel',()=>{
    State.draggingHeart=false;
    c.style.cursor='grab';
  });
}
