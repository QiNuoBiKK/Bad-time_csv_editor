<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bad time editor</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="title">Bad time</div>
    <div class="tab active" id="tabDrag">拖拽</div>
    <div class="tab" id="tabScript">脚本</div>
    <div class="spacer"></div>
    <select id="langSelect" style="background:#141b2d; border:1px solid #1e2a45; color:#94a3b8; padding:6px 10px; border-radius:8px; outline:none; cursor:pointer; font-family:inherit; font-size:13px;">
      <option value="zh">🇨🇳 中文</option>
      <option value="en">🇺🇸 English</option>
    </select>
    <button class="btn small" id="btnHelp">? 使用说明</button>
    <button class="btn small" id="btnAddCmd">+ 添加</button>
    <button class="btn small" id="btnPlay">▶ 播放</button>
    <button class="btn small" id="btnUndo">撤销</button>
    <button class="btn primary" id="btnSave">保存 CSV</button>
  </div>
  <div id="body">
    <div id="modeDrag">
      <div id="canvasArea">
        <div id="canvasWrap">
          <canvas id="canvas"></canvas>
          <div id="canvasInfo">640 × 480</div>
          <div id="coordDisplay">X: 0 Y: 0</div>
        </div>
      </div>
      <div id="paramBar"></div>
      <div id="timeline">
        <div id="timelineHeader">
          <span class="tlabel">时间轴</span>
          <button class="btn small" id="btnImport">导入</button>
          <button class="btn small" id="btnClear">清空</button>
        </div>
        <div id="timelineScroll"><div id="timelineTrack"></div></div>
      </div>
      <div id="bottomTools"></div>
    </div>
    <div id="modeScript" class="hidden">
      <div id="scriptLeft">
        <div id="scriptToolbar">
          <div class="stoggle">
            <div class="stab active" id="stabWrite">编写</div>
            <div class="stab" id="stabGraph">图形</div>
          </div>
          <button class="btn small" id="scPreview">▶ 预览</button>
          <button class="btn small" id="scStop">■ 停止</button>
          <button class="btn small" id="scLoadExample">载入示例</button>
          <button class="btn small" id="scClear">清空</button>
        </div>
        <div id="scriptEditorWrap">
          <div id="scriptLineNums">0</div>
          <textarea id="scriptEditor" spellcheck="false"></textarea>
        </div>
        <div id="scriptGraphWrap" class="hidden"></div>
      </div>
      <div id="scriptRight">
        <div id="scriptPreviewWrap"><canvas id="scriptCanvas"></canvas></div>
        <div id="scriptVars"></div>
        <div id="scriptStatus">未运行</div>
      </div>
    </div>
  </div>
  <div id="statusBar">就绪</div>
</div>
<div id="dragGhost"></div>
<div id="autocomplete"></div>
<div id="varPicker"></div>
<div class="modal-mask" id="helpMask"><div class="modal"><div class="modal-header"><span>使用说明</span><button class="modal-close" id="helpClose">×</button></div><div class="modal-body" id="helpBody"></div></div></div>
<div class="modal-mask" id="addMask"><div class="modal"><div class="modal-header"><span>添加指令</span><button class="modal-close" id="addClose">×</button></div><div class="modal-body" id="addBody"></div></div></div>
<div class="modal-mask" id="paramMask">
  <div class="modal" style="max-width:640px">
    <div class="modal-header"><span id="paramTitle">参数</span><button class="modal-close" id="paramClose">×</button></div>
    <div class="modal-body" id="paramBody"></div>
    <div class="modal-footer" style="padding:12px 18px;border-top:2px solid #2a2a2a;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn small" id="paramDelete" style="margin-right:auto;background:#3a1a1a;border-color:#5a2a2a;color:#f87171">删除</button>
      <button class="btn small" id="paramCancel">取消</button>
      <button class="btn small primary" id="paramOk">确定</button>
    </div>
  </div>
</div>

<!-- 脚本引入 -->
<script src="data.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>
<script src="script.js"></script>
</body>
</html>
